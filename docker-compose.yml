services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: editor
      POSTGRES_PASSWORD: editor
      POSTGRES_DB: editor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  # S3-compatible storage for local dev. MinIO's Docker Hub images now require a
  # paid subscription to pull, so we use LocalStack's S3 emulation instead.
  localstack:
    image: localstack/localstack:3.0.2
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  postgres-data:
  localstack-data:
